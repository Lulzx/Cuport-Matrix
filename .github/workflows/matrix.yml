# Cuport-Matrix lanes.
#
#   hosted-paravirtual - GitHub-hosted macOS arm64 runner. Metal is exposed
#                        through an "Apple Paravirtual device" (a FEATURE
#                        SUBSET of real Apple silicon), so its rows are tagged
#                        hardware=paravirtual. Runs nightly and on dispatch;
#                        the nightly run commits its rows and the regenerated
#                        scoreboard to main.
#   m6-self-hosted     - self-hosted Apple M6 Mac mini (hardware=m6-12c). Runs
#                        .github/scripts/m6-lane.sh when dispatched with m6: true.

name: matrix

on:
  schedule:
    - cron: "17 3 * * *"   # nightly, 03:17 UTC
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to exercise (cumetal | mvcc | all)"
        required: false
        default: "all"
      m6:
        description: "Also run the self-hosted M6 lane (needs the runner online)"
        type: boolean
        required: false
        default: false
      commit:
        description: "Commit the paravirtual rows and scoreboard to main"
        type: boolean
        required: false
        default: false

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hosted-paravirtual:
    name: hosted xcode-27 (paravirtual GPU)
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TOOL: ${{ inputs.tool || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore built tools
        uses: actions/cache@v4
        with:
          path: ~/.local/cuport-tools
          key: cuport-tools-${{ runner.os }}-${{ hashFiles('matrix/tools.yaml', '.github/scripts/build-tools.sh') }}

      - name: Build tools (pinned in matrix/tools.yaml)
        run: .github/scripts/build-tools.sh "$TOOL"

      # Runs even if one tool failed to build: the other still gets a row.
      - name: Run probes and validate rows
        if: ${{ !cancelled() }}
        run: .github/scripts/hosted-lane.sh "$TOOL"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-paravirtual
          path: results/*/paravirtual/
          if-no-files-found: ignore

      - name: Commit rows and scoreboard
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.commit) }}
        run: |
          if ! ls results/*/paravirtual/*.json >/dev/null 2>&1; then
            echo "no paravirtual rows to commit"
            exit 0
          fi
          PYTHONPATH=runner .venv/bin/python -m cuport scoreboard
          git config user.name "cuport-matrix[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/*/paravirtual/ docs/scoreboard.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "exp: paravirtual rows $(date -u +%F)"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          PYTHONPATH=runner .venv/bin/python -m cuport scoreboard --check || {
            PYTHONPATH=runner .venv/bin/python -m cuport scoreboard
            git commit -q --amend --no-edit docs/scoreboard.md
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"

  # Runs only when asked for, so a dispatch does not queue forever while the
  # M6 is offline. Registration steps: docs/m6-runner.md.
  m6-self-hosted:
    name: self-hosted Apple M6 (m6-12c)
    if: ${{ inputs.m6 }}
    runs-on: [self-hosted, macOS, ARM64, m6]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run probes and validate rows
        run: .github/scripts/m6-lane.sh "${{ inputs.tool }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-m6-12c
          path: results/*/m6-12c/
          if-no-files-found: error
