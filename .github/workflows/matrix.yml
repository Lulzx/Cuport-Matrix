# Cuport-Matrix CI skeleton.
#
# Two lanes are planned:
#   hosted   - GitHub-hosted macOS arm64 runner. Metal is exposed through an
#              "Apple Paravirtual device" (GPU family ~5, 32 KB threadgroup
#              memory, no simdgroup-matrix / bf16). It is a FEATURE SUBSET of
#              real Apple silicon, so its rows are tagged hardware=paravirtual.
#   m6-self  - self-hosted Apple M6 Mac mini. Disabled until the runner exists.
#
# This file is configuration only. The probe runner does not exist yet.

name: matrix

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool to exercise (cumetal | mvcc | all)"
        required: false
        default: "all"

jobs:
  hosted-paravirtual:
    name: hosted xcode-27 (paravirtual GPU)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Describe GPU
        run: |
          system_profiler SPDisplaysDataType || true
          sw_vers

      - name: Install tools (pinned in matrix/tools.yaml)
        run: |
          echo "TODO: install CuMetal and mvcc at the pinned tags"

      - name: Run probes
        run: |
          echo "TODO: run probes/ against ${{ github.event.inputs.tool }}"
          echo "TODO: write results/<tool>/paravirtual/<date>.json"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-paravirtual
          path: results/
          if-no-files-found: ignore

